<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Jetson Nano Demo</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f4f7f2;color:#18241a;font:17px system-ui,sans-serif}main{max-width:920px;margin:45px auto;padding:24px}.badge{color:#527839;font-size:12px;letter-spacing:3px;font-weight:700}h1{font-size:clamp(36px,6vw,64px);letter-spacing:-3px;margin:14px 0}p{color:#647060}#chat{min-height:270px;max-height:52vh;overflow:auto;padding:24px;background:white;border:1px solid #dae2d5;border-radius:22px;margin:24px 0}.message{white-space:pre-wrap;line-height:1.65;padding:16px;border-radius:14px;margin-bottom:12px}.user{background:#edf5e5}.assistant{background:#f7f8f5}.role{font-size:11px;text-transform:uppercase;font-weight:800;letter-spacing:2px;color:#527839;margin-bottom:8px}form{display:flex;gap:10px}textarea{flex:1;resize:vertical;border:1px solid #d3dfca;border-radius:16px;padding:15px;font:inherit;min-width:0}button{cursor:pointer;border:0;background:#76b900;color:#172800;border-radius:12px;padding:13px 20px;font:600 14px system-ui}button:disabled{opacity:.5;cursor:wait}.prompts{display:flex;gap:8px;flex-wrap:wrap}.prompts button{background:#e7efdf;font-size:13px}footer{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#76816f;margin-top:18px}#status{min-height:24px;font-size:14px;margin-top:12px}</style>
<main><div class="badge">EXPLORE · ASK · DISCOVER</div><h1>Jetson Nano Demo</h1><p>Big questions. Surprising answers. Start a conversation.</p><div class="prompts"><button data-prompt="Explain how a steel ship floats using a surprising classroom demonstration.">Explain the unexpected</button><button data-prompt="Give me an intriguing logic puzzle. Wait for my answer before revealing the solution.">Challenge my thinking</button><button data-prompt="Invent a clever camera-based robot project for students and explain its perception, planning and action steps.">Imagine a robot</button></div><section id="chat" aria-live="polite"><p>What would you like to explore?</p></section><form><textarea id="input" maxlength="6000" placeholder="Ask a question…" aria-label="Your message" required></textarea><button id="send">Send ↗</button></form><div id="status" role="status"></div><footer><span>Interactive AI demonstration</span><button id="clear" type="button">New conversation</button></footer></main>
<script>const chat=document.querySelector('#chat'),input=document.querySelector('#input'),send=document.querySelector('#send'),status=document.querySelector('#status');let messages=[],busy=false;function add(role,text){if(!messages.length)chat.replaceChildren();const el=document.createElement('div');el.className='message '+role;const label=document.createElement('div');label.className='role';label.textContent=role==='user'?'You':'Assistant';el.append(label,document.createTextNode(text));chat.append(el);chat.scrollTop=chat.scrollHeight}document.querySelectorAll('[data-prompt]').forEach(b=>b.onclick=()=>{input.value=b.dataset.prompt;input.focus()});document.querySelector('#clear').onclick=()=>{if(busy)return;messages=[];chat.replaceChildren();status.textContent='';input.focus()};document.querySelector('form').onsubmit=async e=>{e.preventDefault();const text=input.value.trim();if(!text||busy)return;busy=true;send.disabled=true;add('user',text);messages.push({role:'user',content:text});input.value='';status.textContent='Thinking…';try{const r=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages})});const data=await r.json();if(!r.ok)throw new Error(data.error||'Please try again.');add('assistant',data.answer);messages.push({role:'assistant',content:data.answer});status.textContent=''}catch(err){messages.pop();status.textContent=err.message;input.value=text}finally{busy=false;send.disabled=false;input.focus()}};input.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();document.querySelector('form').requestSubmit()}};</script></html>
