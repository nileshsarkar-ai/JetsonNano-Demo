name: Python compatibility and launcher regressions
on: [push, pull_request]
permissions:
  contents: read
jobs:
  software-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: ['python:3.6.15-buster', 'python:3.9-bullseye', 'python:3.11.3-bullseye']
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax
        run: for file in scripts/*.sh; do bash -n "$file"; done
      - name: Software regressions (no models or hardware)
        run: docker run --rm -v "$PWD:/app" -w /app "${{ matrix.image }}" python -m unittest discover -s tests -v
